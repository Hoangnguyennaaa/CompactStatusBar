name: Build CompactStatusBar Tweak DEB

on:
  push:
    branches:
      - main
    paths:
      - 'Tweak/**'
      - '.github/workflows/build_deb.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Developer Tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install dependencies (ldid, dpkg)
        run: |
          brew install ldid dpkg

      - name: Build DEB Package
        run: |
          cd Tweak
          sed -i '' 's/\r$//' build_deb.sh
          chmod +x build_deb.sh
          set -o pipefail
          ./build_deb.sh 2>&1 | tee build.log

      - name: Output Log to Step Summary
        if: always()
        run: |
          echo "## Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat Tweak/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: Tweak/build.log

      - name: Upload Tweak DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CompactStatusBar-rootless-deb
          path: CompactStatusBar_rootless.deb
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.8
          name: "CompactStatusBar v1.4.8 - Bản phát hành công khai đầu tiên"
          body: |
            ### 🎉 CompactStatusBar v1.4.8 - Bản phát hành công khai đầu tiên (First Public Release)

            Chào mừng bạn đến với bản phát hành chính thức đầu tiên của **CompactStatusBar**! 

            **CompactStatusBar** là tweak tinh chỉnh thanh trạng thái (Status Bar) dành cho thiết bị iPhone/iPad Jailbreak (Rootless). Tweak gom gọn **Pin (Battery)**, **Sóng di động (Cellular)** và **Wi-Fi / 4G / 5G** vào một biểu tượng tròn 3-trong-1 duy nhất, mang lại giao diện tinh gọn, hiện đại và đồng bộ toàn hệ thống.

            ---

            ### ✨ Tính năng nổi bật:
            * 🔋 **Vòng tròn Pin 3-trong-1:** Hiển thị mức pin mượt mà với số % đặt tại đỉnh vương miện (Top Crown), tự động đổi màu theo trạng thái (Xanh lá khi đầy/bình thường, Vàng khi bật Tiết kiệm pin LPM, Đỏ khi pin yếu, hiệu ứng nhịp thở phát sáng khi cắm sạc).
            * 📶 **Chấm sóng di động uốn cong:** 4 chấm báo sóng bo tròn theo đáy vòng tròn, nhận diện chính xác cường độ sóng thực tế.
            * 🌐 **Tâm icon đa năng:** Tự động hiển thị cột sóng Wi-Fi hoặc thế hệ mạng di động (`5G`, `4G`, `LTE`) khi không kết nối Wi-Fi.
            * 🎛️ **Đồng bộ Control Center:** Tự động căn chỉnh vị trí icon trong Trung tâm điều khiển khớp chuẩn theo thanh trạng thái, không bị lệch hay nhảy vị trí.
            * ✋ **Thao tác cử chỉ tiện lợi:**
              * **Chạm 1 lần:** Chuyển đổi nhanh giữa % Pin và % RAM.
              * **Chạm 2 lần:** Mở bảng hiển thị thông số chi tiết (HUD).
              * **Nhấn giữ (0.5s):** Bật chế độ kéo thả để di chuyển vị trí icon tự do trên màn hình.

            ---

            ### 📱 Khả năng tương thích:
            * **Hệ điều hành:** iOS 15.0 – 16.x (và các phiên bản hỗ trợ môi trường Rootless).
            * **Công cụ Jailbreak:** Dopamine 2.x, Palera1n (Rootless), Bootstrap + Serotonin.

            ---

            ### 📦 Hướng dẫn cài đặt:
            1. Tải file **`CompactStatusBar_rootless.deb`** đính kèm bên dưới.
            2. Mở file bằng **Sileo**, **Zebra** hoặc **Filza** và nhấn **Cài đặt (Get / Install)**.
            3. Khởi động lại SpringBoard (**Respring**) để áp dụng tweak.
            4. Vào **Cài đặt (Settings)** -> kéo xuống chọn mục **CompactStatusBar** để bật và tùy biến theo ý thích.
          files: |
            CompactStatusBar_rootless.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
